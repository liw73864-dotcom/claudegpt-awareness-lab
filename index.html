
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Simulation</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px;
  font-family: Arial, sans-serif;
  background: #ffffff;
}

form {
  max-width: 480px;
  margin: 0 auto;
}

label {
  display: block;
  margin: 16px 0 8px;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5d1;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  background: #087f65;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  margin-top: 18px;
  color: #777;
  font-size: 12px;
  text-align: center;
}

#result {
  text-align: center;
  font-size: 14px;
}
</style>
</head>
<body>

<form id="login" autocomplete="off">
  <label for="username">Username / Email</label>
  <input id="username"
         placeholder="Username"
         required>

  <label for="password">Password</label>
  <input id="password"
         type="password"
         placeholder="Password"
         autocomplete="new-password"
         required>

  <button type="submit">Sign In</button>

  <p id="result" role="status"></p>

  <p class="note">
    Thank you for clicking the link！I just want to get this done！
  </p>
</form>

<script>
document.getElementById("login")
  .addEventListener("submit", function(e) {
    e.preventDefault();
    this.reset();
    document.getElementById("result").textContent =
      "Simulation completed.";
  });
</script>

</body>
</html>
