<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeGPT | Sign In</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 14px;
  background: #f5f7f6;
  color: #17211e;
  font-family: Arial, Helvetica, sans-serif;
}

.card {
  max-width: 560px;
  margin: 20px auto;
  padding: 40px 38px;
  background: #ffffff;
  border: 1px solid #e2e8e5;
  border-radius: 15px;
  box-shadow: 0 8px 30px rgba(0,0,0,.04);
}

/* 顶部 Logo 样式 */
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 35px;
}

.emblem {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  background: #079b76;
  border-radius: 12px;
  color: white;
  font-size: 31px;
}

.wordmark {
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -1px;
}

.wordmark span {
  color: #079b76;
}

/* 表单样式 */
label {
  display: block;
  margin: 17px 0 8px;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5d1;
  border-radius: 8px;
  font-size: 15px;
}

input:focus {
  outline: 2px solid #079b76;
  outline-offset: 1px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  background: #087f65;
  border: none;
  border-radius: 9px;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #066b55;
}

#result {
  margin-top: 20px;
  text-align: center;
  color: #087f65;
  font-size: 14px;
  line-height: 1.6;
}

@media (max-width: 600px) {
  .card {
    margin: 8px auto;
    padding: 30px 22px;
  }
  .wordmark {
    font-size: 26px;
  }
}
</style>
</head>

<body>

<main class="card">

  <!-- 仅保留最上面的 Logo 名称 -->
  <div class="brand">
    <div class="emblem" aria-hidden="true">✳</div>
    <div class="wordmark">
      Claude<span>GPT</span>
    </div>
  </div>

  <!-- 仅保留表单部分 -->
  <section id="login">
    <form id="demo-form" autocomplete="off">

      <label for="user">Username / Email</label>
      <input
        id="user"
        type="text"
        placeholder="Demo username"
        autocomplete="off"
        required
      >

      <label for="pass">Password</label>
      <input
        id="pass"
        type="password"
        placeholder="Demo password"
        autocomplete="new-password"
        required
      >

      <button type="submit">Sign In</button>

    </form>

    <p id="result" role="status"></p>
  </section>

</main>

<script>
document.getElementById("demo-form")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("user");
    const password = document.getElementById("pass");
    const result = document.getElementById("result");

    const valid =
      username.value === "student-demo" &&
      password.value === "DemoOnly2026!";

    result.textContent = valid
      ? "Simulation completed successfully."
      : "Please use the classroom demonstration credentials.";

    this.reset();
  });
</script>

</body>
</html>
